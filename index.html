<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcolatore BMI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Calcolatore BMI</h2>
    <main>
        <form class="card" action="index.php" method="post">
            <label>Nome</label>
            <input type="text" name="nome" placeholder="Inserisci il tuo nome">
            <label>Peso (kg)</label>
            <input type="number" name="peso" placeholder="Inserisci il tuo peso">
            <label>Altezza (cm)</label>
            <input type="number" name="altezza" placeholder="Inserisci la tua altezza">
            <button type="submit">Calcola</button>
        </form>
    </main>
</body>
</html>
